name: Unit Tests

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: unit tests
        run: |
          go install .
          go test -v .

      - name: example builds
        run: | 
          go install .
          cd ./examples/simple && go run .
          cd ../complex && go run .